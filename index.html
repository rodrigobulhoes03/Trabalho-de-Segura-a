<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sessão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
    <h1>Iniciar sessão</h1>
    <p class="sub">Introduza as suas credenciais para continuar.</p>

    <form method="post" action="#" autocomplete="on">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username" maxlength="190" autofocus>

        <label for="password">Palavra-passe</label>
        <input type="password" id="password" name="password" required minlength="8" autocomplete="current-password">
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
